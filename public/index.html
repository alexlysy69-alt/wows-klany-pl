<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Polskie Klany WoWS - Wyniki CB</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; text-align: center; }
    table { width: 90%; max-width: 900px; margin: 20px auto; border-collapse: collapse; background: #1e293b; border-radius: 8px; overflow: hidden; }
    th, td { padding: 12px 15px; border-bottom: 1px solid #334155; text-align: left; }
    th { background: #0284c7; color: white; text-transform: uppercase; font-size: 14px; }
    tr:hover { background: #334155; }
    .tag { font-weight: bold; color: #38bdf8; }
    .liga-0 { color: #c084fc; font-weight: bold; } /* Huragan */
    .liga-1 { color: #38bdf8; font-weight: bold; } /* Tajfun */
    .liga-2 { color: #fbbf24; font-weight: bold; } /* Sztorm */
    .liga-3 { color: #4ade80; font-weight: bold; } /* Wichura */
    .liga-4 { color: #cbd5e1; } /* Szkwał */
  </style>
</head>
<body>
  <h1>⚓ Ranking Polskich Klanów WoWS</h1>
  <p id="status">Ładowanie danych z pliku wyniki.json...</p>

  <table id="tabela" style="display:none;">
    <thead>
      <tr>
        <th>#</th>
        <th>Klan</th>
        <th>Liga i Dywizja</th>
        <th>Punkty</th>
        <th>Bitwy</th>
      </tr>
    </thead>
    <tbody id="tabela-body"></tbody>
  </table>

  <script>
    const nazwyLig = ['Huragan', 'Tajfun', 'Sztorm', 'Wichura', 'Szkwał'];

    fetch('./wyniki.json')
      .then(res => {
        if (!res.ok) throw new Error('Brak pliku wyniki.json');
        return res.json();
      })
      .then(klany => {
        document.getElementById('status').style.display = 'none';
        document.getElementById('tabela').style.display = 'table';
        const tbody = document.getElementById('tabela-body');

        klany.forEach((k, index) => {
          const nazwaLigi = nazwyLig[k.liga] || 'Nieznana';
          tbody.innerHTML += `
            <tr>
              <td>${index + 1}</td>
              <td><span class="tag">[${k.tag}]</span> ${k.nazwa}</td>
              <td class="liga-${k.liga}">${nazwaLigi} ${k.dywizja}</td>
              <td><b>${k.punkty}</b> pkt</td>
              <td>${k.bitwy}</td>
            </tr>
          `;
        });
      })
      .catch(() => {
        document.getElementById('status').innerText = 'Strona działa! Czekamy na pierwsze wygenerowanie pliku wyniki.json.';
      });
  </script>
</body>
</html>
