<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Polskie Klany WoWS - Wyniki CB</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; text-align: center; margin: 0; }
    h1 { margin-bottom: 10px; }
    
    /* Karta Aktualnego Lidera */
    .lider-box {
      max-width: 650px; margin: 20px auto 30px; padding: 20px;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 2px solid #eab308; border-radius: 12px;
      box-shadow: 0 0 25px rgba(234, 179, 8, 0.25);
    }
    .lider-tytul { color: #eab308; font-size: 13px; text-transform: uppercase; letter-spacing: 2px; font-weight: bold; }
    .lider-nazwa { font-size: 26px; font-weight: bold; margin: 8px 0; color: #ffffff; }
    .lider-detale { font-size: 15px; color: #cbd5e1; line-height: 1.6; }

    /* Tabela wyników */
    table { width: 95%; max-width: 1150px; margin: 20px auto; border-collapse: collapse; background: #1e293b; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
    th, td { padding: 12px 15px; border-bottom: 1px solid #334155; text-align: left; vertical-align: middle; }
    th { background: #0284c7; color: white; text-transform: uppercase; font-size: 13px; letter-spacing: 0.5px; }
    tr:hover { background: #334155; }
    .tag { font-weight: bold; color: #38bdf8; }
    .brak { color: #64748b; font-style: italic; font-size: 13px; }
    
    /* Detale oceny i Win Ratio */
    .ocena-glowna { font-size: 15px; margin-bottom: 4px; }
    .ocena-staty { font-size: 12px; color: #94a3b8; }
    .wr-badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 12px; margin-right: 6px; background: rgba(255,255,255,0.08); }
    .wr-unicum { color: #c084fc; } /* 65%+ */
    .wr-great { color: #38bdf8; }  /* 58%+ */
    .wr-good { color: #4ade80; }   /* 52%+ */
    .wr-avg { color: #fbbf24; }    /* 48%+ */
    .wr-low { color: #f87171; }    /* poniżej 48% */

    /* Kolory lig WoWS */
    .liga-0 { color: #c084fc; font-weight: bold; } /* Huragan */
    .liga-1 { color: #38bdf8; font-weight: bold; } /* Tajfun */
    .liga-2 { color: #fbbf24; font-weight: bold; } /* Sztorm */
    .liga-3 { color: #4ade80; font-weight: bold; } /* Wichura */
    .liga-4 { color: #cbd5e1; font-weight: bold; } /* Szkwał */
  </style>
</head>
<body>
  <h1>⚓ Ranking Polskich Klanów WoWS</h1>
  <p id="status">Ładowanie danych...</p>

  <!-- Ramka Aktualnego Lidera -->
  <div id="lider-container" style="display:none;"></div>

  <!-- Tabela z obiema ocenami i Win Ratio -->
  <table id="tabela" style="display:none;">
    <thead>
      <tr>
        <th>#</th>
        <th>Klan</th>
        <th>Ocena I (Alfa / Najlepsza)</th>
        <th>Ocena II (Bravo)</th>
        <th>Suma Bitew</th>
      </tr>
    </thead>
    <tbody id="tabela-body"></tbody>
  </table>

  <script>
    const nazwyLig = ['Huragan', 'Tajfun', 'Sztorm', 'Wichura', 'Szkwał'];

    function kolorWR(wr) {
      if (wr >= 65) return 'wr-unicum';
      if (wr >= 58) return 'wr-great';
      if (wr >= 52) return 'wr-good';
      if (wr >= 48) return 'wr-avg';
      return 'wr-low';
    }

    function pokazOcene(ocena) {
      if (!ocena || (ocena.bitwy === 0 && ocena.rating_calkowity === 0)) {
        return '<span class="brak">Brak rozegranych bitew</span>';
      }
      const nazwa = nazwyLig[ocena.liga] || 'Szkwał';
      const dyw = ocena.liga === 0 ? '' : ` ${ocena.dywizja}`;
      
      // Obliczanie Win Ratio dla danej oceny
      const bitwy = ocena.bitwy || 0;
      const wygrane = ocena.wygrane || 0;
      const wr = bitwy > 0 ? ((wygrane / bitwy) * 100).toFixed(1) : '0.0';
      const wrKlasa = kolorWR(parseFloat(wr));

      return `
        <div class="ocena-glowna">
          <span class="liga-${ocena.liga}">${nazwa}${dyw}</span> — <b>${ocena.punkty} pkt</b>
        </div>
        <div class="ocena-staty">
          <span class="wr-badge ${wrKlasa}">WR: ${wr}%</span>
          Bitwy: <b>${bitwy}</b> (${wygrane}W) | Rating: ${ocena.rating_calkowity}
        </div>
      `;
    }

    fetch('./wyniki.json?t=' + Date.now())
      .then(res => res.json())
      .then(klany => {
        document.getElementById('status').style.display = 'none';
        if (!klany || klany.length === 0) return;

        // 1. Wyświetlamy Aktualnego Lidera na górze (pierwszy klan z posortowanej listy)
        const lider = klany[0];
        const liderBox = document.getElementById('lider-container');
        liderBox.style.display = 'block';
        liderBox.innerHTML = `
          <div class="lider-box">
            <div class="lider-tytul">👑 Aktualny Lider Rankingu</div>
            <div class="lider-nazwa"><span class="tag">[${lider.tag}]</span> ${lider.nazwa}</div>
            <div class="lider-detale">
              ${pokazOcene(lider.ocena1)}
            </div>
          </div>
        `;

        // 2. Wypełniamy tabelę z obiema ocenami i ich Win Ratio
        document.getElementById('tabela').style.display = 'table';
        const tbody = document.getElementById('tabela-body');

        klany.forEach((k, index) => {
          const b1 = k.ocena1 ? k.ocena1.bitwy : 0;
          const b2 = k.ocena2 ? k.ocena2.bitwy : 0;

          tbody.innerHTML += `
            <tr>
              <td><b>${index + 1}</b></td>
              <td><span class="tag">[${k.tag}]</span> ${k.nazwa}</td>
              <td>${pokazOcene(k.ocena1)}</td>
              <td>${k.ocena2 ? pokazOcene(k.ocena2) : '<span class="brak">—</span>'}</td>
              <td><b>${k.suma_bitew}</b> <span class="ocena-staty">(${b1} / ${b2})</span></td>
            </tr>
          `;
        });
      })
      .catch(() => {
        document.getElementById('status').innerText = 'Błąd wczytywania pliku wyniki.json.';
      });
  </script>
</body>
</html>
