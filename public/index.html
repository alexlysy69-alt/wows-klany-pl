<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Polish Clan Battles Standings</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0b111e; color: #e2e8f0; margin: 0; padding: 25px 15px; }
    .container { max-width: 1100px; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 22px; }
    .badge-top { display: inline-block; font-size: 9px; color: #38bdf8; border: 1px solid #1e3a5f; background: rgba(14,165,233,0.08); padding: 3px 10px; border-radius: 12px; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
    .header h1 { font-size: 22px; margin: 0; font-weight: 700; color: #f8fafc; }
    .cards-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 16px; }
    .stat-card { background: #131c2e; border: 1px solid #1e293b; border-radius: 6px; padding: 14px 16px; text-align: center; position: relative; overflow: hidden; }
    .stat-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
    .card-blue::before { background: #38bdf8; }
    .card-cyan::before { background: #2dd4bf; }
    .card-red::before { background: #ef4444; }
    .card-gold::before { background: #eab308; }
    .card-label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.8px; color: #64748b; margin-bottom: 8px; font-weight: 600; }
    .card-value { font-size: 20px; font-weight: 700; }
    .val-white { color: #f8fafc; } .val-cyan { color: #38bdf8; } .val-red { color: #ef4444; } .val-gold { color: #eab308; }
    .controls-bar { background: #131c2e; border: 1px solid #1e293b; border-radius: 6px; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 12px; color: #cbd5e1; }
    .controls-left { display: flex; align-items: center; gap: 18px; }
    .controls-left label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .controls-left input { accent-color: #0ea5e9; cursor: pointer; }
    .season-select { background: #0b111e; color: #e2e8f0; border: 1px solid #334155; border-radius: 4px; padding: 5px 10px; font-size: 12px; }
    .search-box { width: 100%; background: #0d1526; border: 1px solid #1e293b; border-radius: 6px; padding: 10px 14px; color: #f8fafc; font-size: 12px; margin-bottom: 16px; outline: none; }
    .search-box:focus { border-color: #0ea5e9; }
    .table-wrap { background: #131c2e; border: 1px solid #1e293b; border-radius: 6px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th { background: #162035; color: #64748b; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; padding: 12px; text-align: left; border-bottom: 1px solid #1e293b; }
    td { padding: 11px 12px; border-bottom: 1px solid #1a263d; color: #cbd5e1; }
    tr:hover td { background: #19253d; }
    .col-center { text-align: center; } .col-right { text-align: right; }
    .pos-cell { color: #64748b; font-weight: 600; width: 45px; }
    .tag-cell { color: #0ea5e9; font-weight: 700; }
    .name-cell { color: #e2e8f0; }
    .rating-cell { color: #64748b; font-size: 11px; }
    .points-cell { font-weight: 700; color: #f8fafc; }
    .wr-high { color: #fbbf24; font-weight: 600; } .wr-mid { color: #e2e8f0; }
    .lg-0 { color: #ef4444; font-weight: 700; font-size: 10px; }
    .lg-1 { color: #f97316; font-weight: 700; font-size: 10px; }
    .lg-2 { color: #eab308; font-weight: 700; font-size: 10px; }
    .lg-3 { color: #38bdf8; font-weight: 700; font-size: 10px; }
    .lg-4 { color: #94a3b8; font-weight: 700; font-size: 10px; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="badge-top">Polish Clan Battles Tracker</div>
    <h1>Clan Battles Standings</h1>
  </div>
  <div class="cards-grid">
    <div class="stat-card card-blue"><div class="card-label">Tracked Polish Clans</div><div class="card-value val-white" id="stat-clans">0</div></div>
    <div class="stat-card card-cyan"><div class="card-label">Average Win Rate</div><div class="card-value val-cyan" id="stat-wr">0.0%</div></div>
    <div class="stat-card card-red"><div class="card-label">Highest League</div><div class="card-value val-red" id="stat-league">—</div></div>
    <div class="stat-card card-gold"><div class="card-label">Current Leader</div><div class="card-value val-gold" id="stat-leader">—</div></div>
  </div>
  <div class="controls-bar">
    <div class="controls-left">
      <label><input type="radio" name="ratingMode" value="max" checked> Highest Rating</label>
      <label><input type="radio" name="ratingMode" value="current"> Current Rating</label>
      <label><input type="checkbox" id="showAlphaBravo" checked> Show Alpha / Bravo</label>
    </div>
    <div><select class="season-select" id="season-select"><option value="current">Current Season</option></select></div>
  </div>
  <input type="text" id="searchInput" class="search-box" placeholder="Search by Clan Tag or Name (e.g. SEEYA, CM69, 505PL, OMRK)...">
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>POS</th><th>CLAN TAG</th><th>CLAN NAME</th><th class="col-center">RATING</th>
          <th class="col-center">BATTLES</th><th class="col-center">WINS</th><th class="col-center">WR (%)</th>
          <th class="col-center">LEAGUE</th><th class="col-center">GROUP</th><th class="col-right">POINTS</th>
        </tr>
      </thead>
      <tbody id="table-body"><tr><td colspan="10" class="col-center">Loading data...</td></tr></tbody>
    </table>
  </div>
</div>
<script>
  var LEAGUE_NAMES = ['HURRICANE', 'TYPHOON', 'STORM', 'GALE', 'SQUALL'];
  var LEAGUE_TITLE = ['Hurricane', 'Typhoon', 'Storm', 'Gale', 'Squall'];
  var ROMAN = ['', 'I', 'II', 'III'];
  var rawClans = [];

  function pobierzOcenyKlanu(clan) {
    if (Array.isArray(clan.oceny) && clan.oceny.length > 0) return clan.oceny;
    var list = [];
    if (clan.ocena1) list.push(Object.assign({}, clan.ocena1, { rating_name: 'Alpha', team_number: 1 }));
    if (clan.ocena2) list.push(Object.assign({}, clan.ocena2, { rating_name: 'Bravo', team_number: 2 }));
    if (list.length === 0) {
      list.push({ rating_name: 'Alpha', team_number: 1, liga: clan.liga !== undefined ? clan.liga : 4, dywizja: clan.dywizja !== undefined ? clan.dywizja : 3, punkty: clan.punkty || 0, rating_calkowity: clan.rating_calkowity || 0, bitwy: clan.bitwy || 0, wygrane: clan.wygrane || 0 });
    }
    return list;
  }

  function render() {
    try {
      var checkedRadio = document.querySelector('input[name="ratingMode"]:checked');
      var mode = checkedRadio ? checkedRadio.value : 'max';
      var showBoth = document.getElementById('showAlphaBravo').checked;
      var query = document.getElementById('searchInput').value.trim().toLowerCase();
      var rows = [];

      rawClans.forEach(function(clan) {
        var oceny = pobierzOcenyKlanu(clan);
        var sorted = oceny.slice().sort(function(a, b) {
          var rA = mode === 'max' ? (a.max_rating_calkowity || a.rating_calkowity || 0) : (a.rating_calkowity || 0);
          var rB = mode === 'max' ? (b.max_rating_calkowity || b.rating_calkowity || 0) : (b.rating_calkowity || 0);
          return rB - rA;
        });
        var first = sorted.at(0);
        var toUse = showBoth ? sorted : (first ? [first] : []);

        toUse.forEach(function(r, idx) {
          if (!r) return;
          if (showBoth && sorted.length > 1 && (r.bitwy || 0) === 0 && idx > 0) return;
          var liga = (mode === 'max' && r.max_liga !== undefined) ? r.max_liga : (r.liga !== undefined ? r.liga : 4);
          var dyw = (mode === 'max' && r.max_dywizja !== undefined) ? r.max_dywizja : (r.dywizja !== undefined ? r.dywizja : 3);
          var pkt = (mode === 'max' && r.max_punkty !== undefined) ? r.max_punkty : (r.punkty !== undefined ? r.punkty : 0);
          var tot = (mode === 'max' && r.max_rating_calkowity !== undefined) ? r.max_rating_calkowity : (r.rating_calkowity !== undefined ? r.rating_calkowity : 0);
          var b = r.bitwy || 0, w = r.wygrane || 0;

          rows.push({
            tag: clan.tag || '???', nazwa: clan.nazwa || '',
            ratingName: r.rating_name || (r.team_number === 2 ? 'Bravo' : 'Alpha'),
            bitwy: b, wygrane: w, wr: b > 0 ? ((w / b) * 100) : 0,
            liga: liga, dywizja: dyw, punkty: pkt, totalRating: tot
          });
        });
      });

      rows.sort(function(a, b) { return (b.totalRating - a.totalRating) || (b.bitwy - a.bitwy); });
      document.getElementById('stat-clans').innerText = String(rawClans.length);

      var active = rows.filter(function(r) { return r.bitwy > 0; });
      if (active.length > 0) {
        var sum = active.reduce(function(acc, r) { return acc + r.wr; }, 0);
        document.getElementById('stat-wr').innerText = (sum / active.length).toFixed(1) + '%';
      }

      var top = rows.at(0);
      if (top) {
        var lName = LEAGUE_TITLE.at(top.liga) || 'Squall';
        var lGrp = top.liga === 0 ? 'I' : (ROMAN.at(top.dywizja) || top.dywizja);
        document.getElementById('stat-league').innerText = lName + ' ' + lGrp;
        document.getElementById('stat-leader').innerText = '[' + top.tag + ']';
      }

      var filtered = rows.filter(function(r) {
        return r.tag.toLowerCase().indexOf(query) !== -1 || r.nazwa.toLowerCase().indexOf(query) !== -1;
      });

      var tbody = document.getElementById('table-body');
      var html = '';
      filtered.forEach(function(r, idx) {
        var wrClass = r.wr >= 53 ? 'wr-high' : 'wr-mid';
        var lgName = LEAGUE_NAMES.at(r.liga) || 'SQUALL';
                html += '<tr><td class="pos-cell">' + (idx + 1) + '</td><td class="tag-cell">[' + r.tag + ']</td><td class="name-cell">' + r.nazwa + '</td><td class="col-center rating-cell">' + r.ratingName + '</td><td class="col-center">' + r.bitwy + '</td><td class="col-center">' + r.wygrane + '</td><td class="col-center ' + wrClass + '">' + r.wr.toFixed(2) + '%</td><td class="col-center"><span class="lg-' + r.liga + '">' + lgName + '</span></td><td class="col-center">' + r.dywizja + '</td><td class="col-right points-cell">' + r.punkty + '</td></tr>';
      });
      tbody.innerHTML = html || '<tr><td colspan="10" class="col-center">Brak danych.</td></tr>';
    } catch (e) {
      document.getElementById('table-body').innerHTML = '<tr><td colspan="10" class="col-center">Błąd: ' + e.message + '</td></tr>';
    }
  }

  document.querySelectorAll('input[name="ratingMode"]').forEach(function(el) { el.addEventListener('change', render); });
  document.getElementById('showAlphaBravo').addEventListener('change', render);
  document.getElementById('searchInput').addEventListener('input', render);

  fetch('./wyniki.json?t=' + Date.now())
    .then(function(res) { return res.json(); })
    .then(function(data) {
      rawClans = Array.isArray(data) ? data : [];
      var first = rawClans.at(0);
      if (first && first.sezon) document.getElementById('season-select').innerHTML = '<option>Season ' + first.sezon + '</option>';
      render();
    })
    .catch(function(err) {
      document.getElementById('table-body').innerHTML = '<tr><td colspan="10" class="col-center">Błąd pliku wyniki.json: ' + err.message + '</td></tr>';
    });
</script>
</body>
</html>
